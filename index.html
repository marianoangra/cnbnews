<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNB News</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;display:grid;place-items:center;min-height:100vh;background:#0b0b0f;color:#f4f4f5;text-align:center}
h1{font-size:2rem;margin:0 0 .5rem}p{color:#a1a1aa}
</style>
</head>
<body>
<main>
<h1 id="t">CNB News</h1>
<p id="s">Portal de notícias das cidades do Brasil. Em breve.</p>
</main>
<script>
// cidade = primeiro rótulo do host: pelotas.news.cnbmobile.com -> "pelotas"
var h=location.hostname.split('.'), c=h.length>=4&&h[0]!=='www'?h[0]:'';
if(c){var n=c.replace(/-/g,' ').replace(/\b\w/g,function(x){return x.toUpperCase()});
document.getElementById('t').textContent='Notícias de '+n;
document.getElementById('s').textContent='Em breve.';document.title=n+' · CNB News';}
</script>
</body>
</html>
