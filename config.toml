baseURL = "https://news.cnbmobile.com/"
languageCode = "pt-br"
defaultContentLanguage = "pt-br"
title = "CNB News"
disableKinds = ["taxonomy", "taxonomyTerm", "term", "RSS"]
enableRobotsTXT = true

[params]
  # Perfis oficiais (rodapé e "sameAs" do JSON-LD: o Google liga o portal aos perfis)
  instagram = "https://www.instagram.com/cnbnewstv/"
  baseDomain = "news.cnbmobile.com"
  descricao = "Notícias do Brasil e da sua cidade, 24 horas: política, economia, esportes, saúde e o que acontece em mais de 130 cidades, sempre com a fonte citada."
  # Botão da TV CNB no cabeçalho (layouts/partials/ao-vivo.html). Vazio = botão escondido.
  # Use o endereço do canal terminando em /live (ex.: "https://www.youtube.com/@CANAL/live"):
  # o YouTube abre a transmissão atual ou, sem live, a página do canal.
  youtube = "https://www.youtube.com/@rafaelmarianobr/live"
  # Deixe false: o botão sai "TV CNB News" no HTML e ACENDE SOZINHO ("CNB News ao vivo", vermelho)
  # quando o canal estiver transmitindo, perguntando a /aovivo.json (rig checa o YouTube a cada 2 min).
  # true força o "ao vivo" no HTML mesmo sem transmissão: não usar.
  aoVivo = false
  # Rádio CNB (services/radio; partials/radio.html + radio-barra.html + static/js/radio.js). URL = Icecast da rig pelo Funnel.
  # radioEmBreve = true: o público vê "em breve"; quem abre o site com ?radio=1 (cookie de teste, 48 h) já ouve. ?radio=0 apaga.
  # Atenção à licença: as faixas da Biblioteca de Áudio do YouTube NÃO podem ir para stream de áudio separado.
  radio = "https://rig1660s.tail4a859f.ts.net/radio"
  radioEmBreve = true

# Sitemap do Google Notícias (layouts/index.newssitemap.xml → /news-sitemap.xml)
[outputFormats.NewsSitemap]
  mediaType = "application/xml"
  baseName = "news-sitemap"
  isPlainText = true
  notAlternative = true

# Índice da busca do portal (layouts/index.buscaindex.json → /busca.json), lido por /busca/
[outputFormats.BuscaIndex]
  mediaType = "application/json"
  baseName = "busca"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "NewsSitemap", "BuscaIndex"]
