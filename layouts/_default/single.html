{{ define "main" }}
<article style="max-width:760px;margin:0 auto;padding:28px 0">
  <p style="font-size:13px;color:#6B7280">{{ .Date.Format "02/01/2006 15:04" }} - {{ .Params.fonte }}</p>
  <h1 style="font-size:34px;line-height:1.2">{{ .Title }}</h1>
  <p style="font-size:19px;color:#374151">{{ .Params.description }}</p>
  <div>{{ .Content }}</div>
  <p style="margin-top:32px;padding:16px;background:#F9FAFB;border-radius:8px">
    Fonte original: <a href="{{ .Params.fonte_url }}" rel="nofollow noopener" target="_blank">{{ .Params.fonte }}</a>
  </p>
</article>
<script type="application/ld+json">
{
  "@context":"https://schema.org",
  "@type":"NewsArticle",
  "headline": {{ .Title | jsonify }},
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05-03:00" }}",
  "description": {{ .Params.description | jsonify }},
  "mainEntityOfPage": "{{ .Permalink }}"
}
</script>
{{ end }}
