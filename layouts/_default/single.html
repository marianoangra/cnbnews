{{ define "main" }}
<article style="max-width:820px;margin:20px auto 40px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:28px;box-shadow:var(--sh)">
  <div style="margin-bottom:14px"><a href="https://cnbmobile.com" style="color:var(--red2);font-weight:800;text-decoration:none;font-size:.85rem">← Voltar para a Capa Nacional</a></div>
  <h1 style="font-size:1.85rem;line-height:1.25;margin:0 0 18px;font-weight:900;border-bottom:1px solid var(--bd);padding-bottom:14px">{{ .Title }}</h1>
  <div style="font-size:1rem;line-height:1.75;color:#e5e7eb">{{ .Content }}</div>
</article>
{{ end }}
